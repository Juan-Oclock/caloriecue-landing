<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#FFFDF7"/>

  <!-- Title -->
  <text x="50" y="48" font-size="29" font-weight="700" fill="#1A1A1A">Cheat Meal vs. Cheat Day vs. Refeed</text>
  <text x="50" y="78" font-size="16" fill="#868E96">Same craving, three very different outcomes</text>

  <!-- Column geometry: 3 cards, x = 50, 350, 650, width 300, gutter 0 (use inner padding) -->
  <!-- Card 1: Cheat Meal (orange, recommended) -->
  <g>
    <rect x="50" y="120" width="280" height="360" rx="14" fill="#FFFFFF" stroke="#FFD8A8" stroke-width="2"/>
    <rect x="50" y="120" width="280" height="64" rx="14" fill="#E8590C"/>
    <rect x="50" y="160" width="280" height="24" fill="#E8590C"/>
    <text x="190" y="160" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cheat Meal</text>

    <text x="190" y="238" font-size="17" font-weight="600" fill="#212529" text-anchor="middle">One meal off-plan</text>
    <line x1="86" y1="268" x2="294" y2="268" stroke="#F1F3F5" stroke-width="1.5"/>
    <text x="190" y="306" font-size="17" font-weight="600" fill="#212529" text-anchor="middle">Easy to absorb</text>
    <line x1="86" y1="336" x2="294" y2="336" stroke="#F1F3F5" stroke-width="1.5"/>
    <text x="190" y="374" font-size="17" font-weight="600" fill="#212529" text-anchor="middle">Low risk</text>

    <rect x="106" y="420" width="168" height="34" rx="17" fill="#FFF4E6"/>
    <text x="190" y="443" font-size="14" font-weight="700" fill="#E8590C" text-anchor="middle">USE FREELY</text>
  </g>

  <!-- Card 2: Cheat Day (gray, avoid) -->
  <g>
    <rect x="360" y="120" width="280" height="360" rx="14" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="2"/>
    <rect x="360" y="120" width="280" height="64" rx="14" fill="#868E96"/>
    <rect x="360" y="160" width="280" height="24" fill="#868E96"/>
    <text x="500" y="160" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cheat Day</text>

    <text x="500" y="238" font-size="17" font-weight="600" fill="#495057" text-anchor="middle">All day unrestricted</text>
    <line x1="396" y1="268" x2="604" y2="268" stroke="#F1F3F5" stroke-width="1.5"/>
    <text x="500" y="306" font-size="17" font-weight="600" fill="#495057" text-anchor="middle">Erases the week</text>
    <line x1="396" y1="336" x2="604" y2="336" stroke="#F1F3F5" stroke-width="1.5"/>
    <text x="500" y="374" font-size="17" font-weight="600" fill="#495057" text-anchor="middle">High risk</text>

    <rect x="416" y="420" width="168" height="34" rx="17" fill="#F1F3F5"/>
    <text x="500" y="443" font-size="14" font-weight="700" fill="#868E96" text-anchor="middle">MOSTLY AVOID</text>
  </g>

  <!-- Card 3: Planned Refeed (orange, smart) -->
  <g>
    <rect x="670" y="120" width="280" height="360" rx="14" fill="#FFFFFF" stroke="#FFD8A8" stroke-width="2"/>
    <rect x="670" y="120" width="280" height="64" rx="14" fill="#E8590C"/>
    <rect x="670" y="160" width="280" height="24" fill="#E8590C"/>
    <text x="810" y="160" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Planned Refeed</text>

    <text x="810" y="238" font-size="17" font-weight="600" fill="#212529" text-anchor="middle">Extra carbs, set amount</text>
    <line x1="706" y1="268" x2="914" y2="268" stroke="#F1F3F5" stroke-width="1.5"/>
    <text x="810" y="306" font-size="17" font-weight="600" fill="#212529" text-anchor="middle">Controlled surplus</text>
    <line x1="706" y1="336" x2="914" y2="336" stroke="#F1F3F5" stroke-width="1.5"/>
    <text x="810" y="374" font-size="17" font-weight="600" fill="#212529" text-anchor="middle">Smart option</text>

    <rect x="726" y="420" width="168" height="34" rx="17" fill="#FFF4E6"/>
    <text x="810" y="443" font-size="14" font-weight="700" fill="#E8590C" text-anchor="middle">SMART CHOICE</text>
  </g>

  <!-- Footer -->
  <text x="50" y="520" font-size="13" fill="#ADB5BD">A meal ends and is easy to absorb. A day sprawls and erases the week. A refeed is the controlled middle ground.</text>
  <text x="950" y="520" font-size="14" font-weight="700" fill="#E8590C" text-anchor="end">caloriecue.app</text>
</svg>
