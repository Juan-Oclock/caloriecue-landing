<svg width="1000" height="840" viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="840" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="50" y="48" font-size="30" font-weight="700" fill="#1A1A1A">Protein Per Calorie: Foods Ranked by Efficiency</text>
  <text x="50" y="78" font-size="16" font-weight="400" fill="#868E96">Grams of protein per calorie &#183; USDA data, per 100g cooked &#183; higher is better</text>

  <!-- Legend -->
  <g font-size="14" font-weight="500">
    <rect x="50" y="98" width="14" height="14" rx="3" fill="#E8590C"/>
    <text x="70" y="110" fill="#495057">Elite (0.20+)</text>

    <rect x="185" y="98" width="14" height="14" rx="3" fill="#FD7E14"/>
    <text x="205" y="110" fill="#495057">Excellent (0.13&#8211;0.19)</text>

    <rect x="372" y="98" width="14" height="14" rx="3" fill="#FFA94D"/>
    <text x="392" y="110" fill="#495057">Decent (0.08&#8211;0.12)</text>

    <rect x="540" y="98" width="14" height="14" rx="3" fill="#CED4DA"/>
    <text x="560" y="110" fill="#495057">Imposter (&#8804;0.07)</text>
  </g>

  <!-- Gridlines -->
  <g stroke="#E9ECEF" stroke-width="1">
    <line x1="250" y1="140" x2="250" y2="738"/>
    <line x1="380" y1="140" x2="380" y2="738"/>
    <line x1="510" y1="140" x2="510" y2="738"/>
    <line x1="640" y1="140" x2="640" y2="738"/>
    <line x1="770" y1="140" x2="770" y2="738"/>
    <line x1="900" y1="140" x2="900" y2="738"/>
  </g>

  <!-- Axis baseline -->
  <line x1="250" y1="738" x2="900" y2="738" stroke="#CED4DA" stroke-width="1.5"/>

  <!-- Axis labels -->
  <g font-size="13" fill="#ADB5BD" text-anchor="middle">
    <text x="250" y="758">0</text>
    <text x="380" y="758">0.05</text>
    <text x="510" y="758">0.10</text>
    <text x="640" y="758">0.15</text>
    <text x="770" y="758">0.20</text>
    <text x="900" y="758">0.25</text>
  </g>

  <!-- ===== BARS ===== -->
  <!-- scale: 2600px per 1.0 unit; bars start at x=250 -->

  <!-- 1. Shrimp 0.24 -->
  <text x="235" y="170" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Shrimp</text>
  <rect x="250" y="155" width="624" height="30" rx="4" fill="#E8590C"/>
  <text x="886" y="170" font-size="14" font-weight="700" fill="#E8590C">0.24</text>

  <!-- 2. Cod 0.22 -->
  <text x="235" y="220" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Cod (white fish)</text>
  <rect x="250" y="205" width="572" height="30" rx="4" fill="#E8590C"/>
  <text x="834" y="220" font-size="14" font-weight="700" fill="#E8590C">0.22</text>

  <!-- 3. Egg whites 0.21 -->
  <text x="235" y="270" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Egg whites</text>
  <rect x="250" y="255" width="546" height="30" rx="4" fill="#E8590C"/>
  <text x="808" y="270" font-size="14" font-weight="700" fill="#E8590C">0.21</text>

  <!-- 4. Chicken breast 0.19 -->
  <text x="235" y="320" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Chicken breast</text>
  <rect x="250" y="305" width="494" height="30" rx="4" fill="#FD7E14"/>
  <text x="756" y="320" font-size="14" font-weight="700" fill="#FD7E14">0.19</text>

  <!-- 5. Greek yogurt (nonfat) 0.17 -->
  <text x="235" y="370" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Greek yogurt (nonfat)</text>
  <rect x="250" y="355" width="442" height="30" rx="4" fill="#FD7E14"/>
  <text x="704" y="370" font-size="14" font-weight="700" fill="#FD7E14">0.17</text>

  <!-- 6. Cottage cheese (1%) 0.17 -->
  <text x="235" y="420" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Cottage cheese (1%)</text>
  <rect x="250" y="405" width="442" height="30" rx="4" fill="#FD7E14"/>
  <text x="704" y="420" font-size="14" font-weight="700" fill="#FD7E14">0.17</text>

  <!-- 7. Tofu (firm) 0.12 -->
  <text x="235" y="470" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Tofu (firm)</text>
  <rect x="250" y="455" width="312" height="30" rx="4" fill="#FFA94D"/>
  <text x="574" y="470" font-size="14" font-weight="700" fill="#E8920C">0.12</text>

  <!-- 8. Salmon 0.12 -->
  <text x="235" y="520" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Salmon</text>
  <rect x="250" y="505" width="312" height="30" rx="4" fill="#FFA94D"/>
  <text x="574" y="520" font-size="14" font-weight="700" fill="#E8920C">0.12</text>

  <!-- 9. Whole eggs 0.08 -->
  <text x="235" y="570" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Whole eggs</text>
  <rect x="250" y="555" width="208" height="30" rx="4" fill="#FFA94D"/>
  <text x="470" y="570" font-size="14" font-weight="700" fill="#E8920C">0.08</text>

  <!-- 10. Cheddar cheese 0.06 -->
  <text x="235" y="620" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Cheddar cheese</text>
  <rect x="250" y="605" width="156" height="30" rx="4" fill="#CED4DA"/>
  <text x="418" y="620" font-size="14" font-weight="700" fill="#868E96">0.06</text>

  <!-- 11. Almonds 0.04 -->
  <text x="235" y="670" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Almonds</text>
  <rect x="250" y="655" width="104" height="30" rx="4" fill="#CED4DA"/>
  <text x="366" y="670" font-size="14" font-weight="700" fill="#868E96">0.04</text>

  <!-- 12. Peanut butter 0.04 -->
  <text x="235" y="720" font-size="15" font-weight="500" fill="#212529" text-anchor="end">Peanut butter</text>
  <rect x="250" y="705" width="104" height="30" rx="4" fill="#CED4DA"/>
  <text x="366" y="720" font-size="14" font-weight="700" fill="#868E96">0.04</text>

  <!-- Footer -->
  <text x="50" y="800" font-size="13" fill="#ADB5BD">Source: USDA FoodData Central. Values rounded; vary slightly by cut and brand.</text>
  <text x="950" y="800" font-size="14" font-weight="700" fill="#E8590C" text-anchor="end">caloriecue.app</text>
</svg>
