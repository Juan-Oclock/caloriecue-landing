        <text x="24" y="91" fill="#0f172a" font-size="24" font-weight="800">No-cook day</text>
        <text x="24" y="140" fill="#334155" font-size="18">Greek yogurt</text>
        <text x="24" y="174" fill="#334155" font-size="18">Rotisserie salad</text>
        <text x="24" y="208" fill="#334155" font-size="18">Egg wrap</text>
        <rect x="24" y="272" width="164" height="52" rx="18" fill="#0f172a"/>
