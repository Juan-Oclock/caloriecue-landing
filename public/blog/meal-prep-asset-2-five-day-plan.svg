        <text x="24" y="91" fill="#0f172a" font-size="24" font-weight="800">Chicken bowl</text>
        <text x="24" y="140" fill="#334155" font-size="18">Yogurt bowl</text>
        <text x="24" y="174" fill="#334155" font-size="18">Chicken rice bowl</text>
        <text x="24" y="208" fill="#334155" font-size="18">Turkey taco plate</text>
        <rect x="24" y="272" width="164" height="52" rx="18" fill="#0f172a"/>
        <text x="48" y="305" fill="#fff" font-size="20" font-weight="800">~1,520 / 132g</text>
      </g>
      <g transform="translate(233 0)">
        <rect width="212" height="360" rx="26" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
