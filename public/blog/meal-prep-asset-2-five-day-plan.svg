<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Five high protein calorie counting meal prep days</title>
  <desc id="desc">Five day cards with calorie and protein targets for a calorie counting meal prep week.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1376" height="768" rx="48" fill="url(#bg)"/>
  <g transform="translate(82 72)">
    <text x="0" y="0" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">5 high-protein days you can log fast</text>
    <text x="0" y="42" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22">Repeat breakfasts and snacks. Rotate lunch and dinner so the week does not feel copied.</text>
  </g>
  <g transform="translate(82 160)" filter="url(#shadow)">
    <rect width="1212" height="476" rx="34" fill="#ffffff"/>
    <g transform="translate(34 38)" font-family="Inter, Arial, sans-serif">
      <g>
        <rect width="212" height="360" rx="26" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
