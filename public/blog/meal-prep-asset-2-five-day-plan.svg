        <text x="24" y="91" fill="#0f172a" font-size="24" font-weight="800">Turkey wrap</text>
        <text x="24" y="140" fill="#334155" font-size="18">Egg toast</text>
        <text x="24" y="174" fill="#334155" font-size="18">Turkey hummus wrap</text>
        <text x="24" y="208" fill="#334155" font-size="18">Chicken stir fry</text>
        <rect x="24" y="272" width="164" height="52" rx="18" fill="#0f172a"/>
        <text x="48" y="305" fill="#fff" font-size="20" font-weight="800">~1,590 / 126g</text>
      </g>
      <g transform="translate(466 0)">
        <rect width="212" height="360" rx="26" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
