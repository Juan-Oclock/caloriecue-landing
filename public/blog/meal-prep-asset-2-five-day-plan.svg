        <text x="24" y="91" fill="#0f172a" font-size="24" font-weight="800">Salmon plate</text>
        <text x="24" y="140" fill="#334155" font-size="18">Protein oats</text>
        <text x="24" y="174" fill="#334155" font-size="18">Chicken salad box</text>
        <text x="24" y="208" fill="#334155" font-size="18">Salmon potato</text>
        <rect x="24" y="272" width="164" height="52" rx="18" fill="#0f172a"/>
        <text x="48" y="305" fill="#fff" font-size="20" font-weight="800">~1,640 / 121g</text>
      </g>
