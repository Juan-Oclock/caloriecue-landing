<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Calories per gram chart</title>
  <desc id="desc">Protein has 4 calories per gram, carbohydrates 4, fat 9, and alcohol 7.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#30251F" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5F0E8"/>
    </linearGradient>
  </defs>
  <rect width="1376" height="768" rx="34" fill="url(#bg)"/>
  <circle cx="1280" cy="74" r="132" fill="#E05A3A" opacity="0.07"/>
  <circle cx="92" cy="716" r="170" fill="#4E8064" opacity="0.06"/>

  <text x="688" y="82" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#211C19">Calories per gram</text>
  <text x="688" y="120" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#706963">The 4-4-9-7 rule for converting nutrient grams into energy</text>

  <g filter="url(#shadow)">
    <g transform="translate(68 166)">
      <rect width="286" height="398" rx="24" fill="#FFFFFF"/>
      <rect width="286" height="10" rx="5" fill="#E05A3A"/>
      <circle cx="143" cy="78" r="38" fill="#FFF0EA"/>
      <path d="M124 82c13-24 25-24 38 0M125 73h36M134 62v42M152 62v42" fill="none" stroke="#E05A3A" stroke-width="5" stroke-linecap="round"/>
      <text x="143" y="145" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="750" fill="#3B332E">PROTEIN</text>
      <text x="143" y="248" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="102" font-weight="850" fill="#211C19">4</text>
      <text x="143" y="282" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="650" fill="#706963">calories per gram</text>
      <rect x="36" y="320" width="214" height="48" rx="14" fill="#FFF5F1"/>
      <text x="143" y="351" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#B7462C">10 g = 40 calories</text>
    </g>

    <g transform="translate(386 166)">
      <rect width="286" height="398" rx="24" fill="#FFFFFF"/>
      <rect width="286" height="10" rx="5" fill="#D3932F"/>
      <circle cx="143" cy="78" r="38" fill="#FFF8E8"/>
      <path d="M121 94c15-29 28-40 44-38-3 18-14 33-33 43M130 88c11-7 21-15 31-26" fill="none" stroke="#D3932F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="143" y="145" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="750" fill="#3B332E">CARBOHYDRATES</text>
      <text x="143" y="248" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="102" font-weight="850" fill="#211C19">4</text>
      <text x="143" y="282" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="650" fill="#706963">calories per gram</text>
      <rect x="36" y="320" width="214" height="48" rx="14" fill="#FFFAEE"/>
      <text x="143" y="351" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#95651E">10 g = 40 calories</text>
    </g>

    <g transform="translate(704 166)">
      <rect width="286" height="398" rx="24" fill="#FFFFFF"/>
      <rect width="286" height="10" rx="5" fill="#4E8064"/>
      <circle cx="143" cy="78" r="38" fill="#EEF7F1"/>
      <path d="M143 50c17 22 25 35 25 47a25 25 0 01-50 0c0-12 8-25 25-47z" fill="none" stroke="#4E8064" stroke-width="5" stroke-linejoin="round"/>
      <text x="143" y="145" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="750" fill="#3B332E">FAT</text>
      <text x="143" y="248" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="102" font-weight="850" fill="#211C19">9</text>
      <text x="143" y="282" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="650" fill="#706963">calories per gram</text>
      <rect x="36" y="320" width="214" height="48" rx="14" fill="#F1F8F3"/>
      <text x="143" y="351" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#376249">10 g = 90 calories</text>
    </g>

    <g transform="translate(1022 166)">
      <rect width="286" height="398" rx="24" fill="#FFFFFF"/>
      <rect width="286" height="10" rx="5" fill="#7A668F"/>
      <circle cx="143" cy="78" r="38" fill="#F5F0F8"/>
      <path d="M121 57h44l-5 18c-3 11-10 17-17 17s-14-6-17-17l-5-18zM143 92v13M129 106h28" fill="none" stroke="#7A668F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="143" y="145" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="750" fill="#3B332E">ALCOHOL</text>
      <text x="143" y="248" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="102" font-weight="850" fill="#211C19">7</text>
      <text x="143" y="282" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="650" fill="#706963">calories per gram</text>
      <rect x="36" y="320" width="214" height="48" rx="14" fill="#F7F3F9"/>
      <text x="143" y="351" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#665274">10 g = 70 calories</text>
    </g>
  </g>

  <rect x="142" y="615" width="1092" height="92" rx="24" fill="#211C19"/>
  <text x="688" y="654" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#EAA38F">THE FORMULA</text>
  <text x="688" y="687" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">(protein × 4) + (carbs × 4) + (fat × 9) + (alcohol × 7)</text>
  <text x="1284" y="738" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E05A3A">caloriecue.app</text>
</svg>
