<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .badge { transform-box: fill-box; transform-origin: center; }
    .b1 { animation: pop 3s ease-in-out infinite; }
    .b2 { animation: pop 3s ease-in-out infinite .5s; }
    .b3 { animation: pop 3s ease-in-out infinite 1s; }
    .b4 { animation: pop 3s ease-in-out infinite 1.5s; }
    .b5 { animation: pop 3s ease-in-out infinite 2s; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @media (prefers-reduced-motion: reduce) { .b1,.b2,.b3,.b4,.b5 { animation: none; } }
  </style>

  <rect width="800" height="540" fill="#FFFFFF"/>
  <text x="48" y="56" font-size="30" font-weight="700" fill="#1A1A1A">Smart cart swaps</text>
  <text x="48" y="86" font-size="16" fill="#6B7280">Same role on your plate, a fraction of the calories. Small changes, big weekly savings.</text>
  <line x1="48" y1="108" x2="752" y2="108" stroke="#E5E7EB" stroke-width="1"/>

  <!-- row template: from-chip  arrow  to-chip  badge -->
  <!-- Row 1 -->
  <g transform="translate(48,130)">
    <rect x="0" y="0" width="190" height="48" rx="12" fill="#F3F4F6"/>
    <text x="95" y="30" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle">Mayo</text>
    <path d="M205 24 H255" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round"/>
    <path d="M247 17 L257 24 L247 31" fill="none" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="0" width="190" height="48" rx="12" fill="#FFE7DD"/>
    <text x="365" y="30" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">Mustard</text>
    <g class="badge b1"><rect x="566" y="6" width="138" height="36" rx="18" fill="#FF6A3D"/><text x="635" y="30" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#8722;90 cal</text></g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(48,208)">
    <rect x="0" y="0" width="190" height="48" rx="12" fill="#F3F4F6"/>
    <text x="95" y="30" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle">Sour cream</text>
    <path d="M205 24 H255" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round"/>
    <path d="M247 17 L257 24 L247 31" fill="none" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="0" width="190" height="48" rx="12" fill="#FFE7DD"/>
    <text x="365" y="30" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">Greek yogurt</text>
    <g class="badge b2"><rect x="566" y="6" width="138" height="36" rx="18" fill="#FF6A3D"/><text x="635" y="30" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#8722;45 cal</text></g>
  </g>

  <!-- Row 3 -->
  <g transform="translate(48,286)">
    <rect x="0" y="0" width="190" height="48" rx="12" fill="#F3F4F6"/>
    <text x="95" y="30" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle">Soda</text>
    <path d="M205 24 H255" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round"/>
    <path d="M247 17 L257 24 L247 31" fill="none" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="0" width="190" height="48" rx="12" fill="#FFE7DD"/>
    <text x="365" y="30" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">Sparkling water</text>
    <g class="badge b3"><rect x="560" y="6" width="144" height="36" rx="18" fill="#FF6A3D"/><text x="632" y="30" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#8722;140 cal</text></g>
  </g>

  <!-- Row 4 -->
  <g transform="translate(48,364)">
    <rect x="0" y="0" width="190" height="48" rx="12" fill="#F3F4F6"/>
    <text x="95" y="30" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle">Granola</text>
    <path d="M205 24 H255" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round"/>
    <path d="M247 17 L257 24 L247 31" fill="none" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="0" width="190" height="48" rx="12" fill="#FFE7DD"/>
    <text x="365" y="30" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">Plain oats</text>
    <g class="badge b4"><rect x="566" y="6" width="138" height="36" rx="18" fill="#FF6A3D"/><text x="635" y="30" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#8722;90 cal</text></g>
  </g>

  <!-- Row 5 -->
  <g transform="translate(48,442)">
    <rect x="0" y="0" width="190" height="48" rx="12" fill="#F3F4F6"/>
    <text x="95" y="30" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle">Ranch dressing</text>
    <path d="M205 24 H255" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round"/>
    <path d="M247 17 L257 24 L247 31" fill="none" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="0" width="190" height="48" rx="12" fill="#FFE7DD"/>
    <text x="365" y="30" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">Salsa</text>
    <g class="badge b5"><rect x="560" y="6" width="144" height="36" rx="18" fill="#FF6A3D"/><text x="632" y="30" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#8722;120 cal</text></g>
  </g>

  <text x="48" y="524" font-size="13" fill="#9CA3AF">Per typical serving; approximate. Savings add up fast across a week of meals.</text>
</svg>
