<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="50" y="48" font-size="29" font-weight="700" fill="#1A1A1A">The Leptin "Boost" Doesn't Last</text>
  <text x="50" y="78" font-size="16" fill="#868E96">Leptin level after a big meal &#183; what cheat-day culture claims vs what happens</text>

  <!-- Axes. Plot area x=110..930, y=130..420. X = hours 0..72. baseline leptin at y=380. peak ~25% up at y=200. -->
  <!-- Y axis -->
  <line x1="110" y1="130" x2="110" y2="420" stroke="#CED4DA" stroke-width="1.5"/>
  <!-- X axis -->
  <line x1="110" y1="420" x2="930" y2="420" stroke="#CED4DA" stroke-width="1.5"/>

  <!-- baseline dashed -->
  <line x1="110" y1="380" x2="930" y2="380" stroke="#ADB5BD" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="120" y="373" font-size="12" fill="#ADB5BD">baseline leptin</text>

  <!-- X labels: 0h, 6h, 12h, 24h, 48h, 72h. Map: 0h=110, 72h=930 -> 11.4px/hr -->
  <g font-size="12" fill="#ADB5BD" text-anchor="middle">
    <text x="110" y="440">meal</text>
    <text x="178" y="440">6h</text>
    <text x="247" y="440">12h</text>
    <text x="384" y="440">24h</text>
    <text x="658" y="440">48h</text>
    <text x="930" y="440">72h</text>
  </g>
  <text x="520" y="466" font-size="13" fill="#ADB5BD" text-anchor="middle" font-style="italic">hours after the meal</text>

  <!-- +25% marker -->
  <text x="118" y="188" font-size="12" fill="#E8590C" font-weight="700" text-anchor="start">+20&#8211;30%</text>

  <!-- THE MYTH: flat-ish elevated line staying high for 48-72h (gray dashed) -->
  <polyline fill="none" stroke="#CED4DA" stroke-width="3" stroke-dasharray="7,5"
    points="110,380 150,210 250,205 400,210 658,220 930,235"/>
  <text x="800" y="210" font-size="13" font-weight="700" fill="#ADB5BD">the myth</text>
  <text x="800" y="228" font-size="11" fill="#ADB5BD">"48&#8211;72h boost"</text>

  <!-- REALITY: spike up then decay back to baseline by ~24h (orange solid) -->
  <polyline fill="none" stroke="#E8590C" stroke-width="4"
    points="110,380 150,200 200,235 260,300 330,360 384,378 500,380 930,380"/>
  <circle cx="150" cy="200" r="5" fill="#E8590C"/>
  <text x="430" y="350" font-size="13" font-weight="700" fill="#E8590C">what actually happens</text>
  <text x="430" y="368" font-size="11" fill="#E8590C">back to baseline within ~24h</text>

  <!-- Footer -->
  <text x="50" y="500" font-size="13" fill="#ADB5BD">Overeating raises leptin ~20&#8211;30%, but it returns to baseline within a day. Reversing diet adaptation</text>
  <text x="50" y="520" font-size="13" fill="#ADB5BD">takes 7&#8211;10 days of structured refeeding &#8212; not one meal.</text>
  <text x="950" y="520" font-size="14" font-weight="700" fill="#E8590C" text-anchor="end">caloriecue.app</text>
</svg>
