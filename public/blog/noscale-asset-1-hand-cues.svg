<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="410" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#1A1A1A">Your hand is a calorie estimator</text>
  <text x="40" y="84" font-size="16" fill="#6B7280">Four cues that cover almost any plate — no scale, no measuring cups.</text>
  <line x1="40" y1="106" x2="760" y2="106" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Card 1: Palm -->
  <g transform="translate(40,128)">
    <rect width="342" height="120" rx="16" fill="#FAFAFA" stroke="#EEEEEE" stroke-width="1.5"/>
    <text x="24" y="44" font-size="18" font-weight="800" fill="#FF6A3D" letter-spacing="1">PALM</text>
    <text x="24" y="74" font-size="16" font-weight="600" fill="#1A1A1A">Protein</text>
    <text x="24" y="96" font-size="13" fill="#9CA3AF">meat, fish, tofu</text>
    <rect x="200" y="40" width="118" height="40" rx="20" fill="#FF6A3D"/>
    <text x="259" y="65" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">~150 cal</text>
  </g>

  <!-- Card 2: Cupped hand -->
  <g transform="translate(418,128)">
    <rect width="342" height="120" rx="16" fill="#FAFAFA" stroke="#EEEEEE" stroke-width="1.5"/>
    <text x="24" y="44" font-size="18" font-weight="800" fill="#FF6A3D" letter-spacing="1">CUPPED HAND</text>
    <text x="24" y="74" font-size="16" font-weight="600" fill="#1A1A1A">Carbs</text>
    <text x="24" y="96" font-size="13" fill="#9CA3AF">rice, pasta, oats</text>
    <rect x="200" y="40" width="118" height="40" rx="20" fill="#FF6A3D"/>
    <text x="259" y="65" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">~120 cal</text>
  </g>

  <!-- Card 3: Fist -->
  <g transform="translate(40,266)">
    <rect width="342" height="120" rx="16" fill="#FAFAFA" stroke="#EEEEEE" stroke-width="1.5"/>
    <text x="24" y="44" font-size="18" font-weight="800" fill="#FF6A3D" letter-spacing="1">FIST</text>
    <text x="24" y="74" font-size="16" font-weight="600" fill="#1A1A1A">Vegetables</text>
    <text x="24" y="96" font-size="13" fill="#9CA3AF">broccoli, greens, peppers</text>
    <rect x="208" y="40" width="110" height="40" rx="20" fill="#FF6A3D"/>
    <text x="263" y="65" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">~30 cal</text>
  </g>

  <!-- Card 4: Thumb -->
  <g transform="translate(418,266)">
    <rect width="342" height="120" rx="16" fill="#FAFAFA" stroke="#EEEEEE" stroke-width="1.5"/>
    <text x="24" y="44" font-size="18" font-weight="800" fill="#FF6A3D" letter-spacing="1">THUMB</text>
    <text x="24" y="74" font-size="16" font-weight="600" fill="#1A1A1A">Fats</text>
    <text x="24" y="96" font-size="13" fill="#9CA3AF">oil, butter, nut butter</text>
    <rect x="200" y="40" width="118" height="40" rx="20" fill="#FF6A3D"/>
    <text x="259" y="65" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">~120 cal</text>
  </g>
</svg>
