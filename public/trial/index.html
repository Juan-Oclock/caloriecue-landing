<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Your Free Trial - CalorieCue</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f5f5f5;
  color: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.container {
  text-align: center;
  max-width: 400px;
  background: #fff;
  border-radius: 24px;
  padding: 48px 32px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.logo {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  margin-bottom: 8px;
}
.brand {
  font-size: 14px;
  font-weight: 600;
  color: #FF6B35;
  margin-bottom: 24px;
}
h1 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}
p {
  font-size: 15px;
  color: #666;
  line-height: 1.6;
  margin-bottom: 24px;
}
.cta {
  display: inline-block;
  background: #FF6B35;
  color: #fff;
  text-decoration: none;
  padding: 16px 48px;
  border-radius: 100px;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
}
.subtext {
  font-size: 13px;
  color: #888;
}
.subtext a {
  color: #FF6B35;
  text-decoration: none;
}
</style>
<script>
// Attempt to open the app via deep link
(function() {
  var deepLink = 'caloriecue://trial/start';
  var appStoreUrl = 'https://apps.apple.com/us/app/caloriecue-calorie-counter/id6757112503';
  var start = Date.now();

  // Try opening the deep link
  window.location.href = deepLink;

  // If the app didn't open after 1.5s, redirect to App Store
  setTimeout(function() {
    if (Date.now() - start < 2000) {
      window.location.href = appStoreUrl;
    }
  }, 1500);
})();
</script>
</head>
<body>
<div class="container">
  <img src="https://bxhgpvkkeyguovvyqsft.supabase.co/storage/v1/object/public/assets/caloriecue-logo.png" alt="CalorieCue" class="logo" />
  <div class="brand">CalorieCue</div>
  <h1>Start Your Free Trial</h1>
  <p>Opening CalorieCue...</p>
  <a href="caloriecue://trial/start" class="cta">Open App</a>
  <p class="subtext">Don't have the app? <a href="https://apps.apple.com/us/app/caloriecue-calorie-counter/id6757112503">Download from App Store</a></p>
</div>
</body>
</html>
